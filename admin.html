<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Administração | CRFE 2027</title>

    <link
        rel="stylesheet"
        href="css/styles.css"
    >

    <style>

        /* =====================================================
           BASE
        ===================================================== */

        body {
            margin: 0;
            background: #f5f8f6;
            color: #173d2c;
            font-family: Arial, sans-serif;
        }


        /* =====================================================
           HEADER PADRÃO
        ===================================================== */

        .site-header {
            width: 100%;
            background: #ffffff;
            border-bottom: 1px solid #e3e9e5;
            box-shadow: 0 2px 12px rgba(20, 60, 40, 0.04);
        }


        .site-header .container {
            width: min(1180px, 92%);
            min-height: 76px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
        }


        .site-header .logo {
            display: inline-flex;
            align-items: baseline;
            gap: 5px;
            color: #0b7a3b;
            text-decoration: none;
            font-size: 27px;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -0.5px;
            flex-shrink: 0;
        }


        .site-header .logo span {
            color: #173d2c;
            font-size: 15px;
            font-weight: 800;
        }


        .site-header nav {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 20px;
            flex-wrap: wrap;
        }


        .site-header nav a {
            display: inline-flex;
            align-items: center;
            min-height: 42px;
            color: #294538;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
            transition: 0.2s ease;
        }


        .site-header nav a:hover {
            color: #0b7a3b;
        }


        .site-header nav a:last-child {
            padding: 0 17px;
            border-radius: 9px;
            background: #0b7a3b;
            color: #ffffff;
        }


        .site-header nav a:last-child:hover {
            background: #086330;
            color: #ffffff;
        }


        /* =====================================================
           CONTEÚDO
        ===================================================== */

        .admin-container {
            width: min(1180px, 92%);
            margin: 40px auto 70px;
        }


        .admin-header {
            margin-bottom: 30px;
        }


        .admin-header h1 {
            margin: 0 0 8px;
            font-size: 30px;
            color: #173d2c;
        }


        .admin-header p {
            margin: 0;
            color: #65756d;
            font-size: 14px;
        }


        /* =====================================================
           RESUMO
        ===================================================== */

        .resumo {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 25px;
        }


        .resumo-card {
            background: #ffffff;
            border: 1px solid #e3e9e5;
            border-radius: 14px;
            padding: 22px;
            box-shadow: 0 4px 18px rgba(20, 60, 40, 0.05);
        }


        .resumo-card span {
            display: block;
            margin-bottom: 8px;
            color: #718078;
            font-size: 12px;
            font-weight: 700;
        }


        .resumo-card strong {
            display: block;
            color: #0b7a3b;
            font-size: 27px;
            line-height: 1;
        }


        /* =====================================================
           CARD PRINCIPAL
        ===================================================== */

        .card {
            background: #ffffff;
            border: 1px solid #e3e9e5;
            border-radius: 14px;
            padding: 25px;
            box-shadow: 0 4px 18px rgba(20, 60, 40, 0.05);
        }


        /* =====================================================
           FILTROS
        ===================================================== */

        .filtros {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 14px;
            margin-bottom: 25px;
        }


        .filtros select,
        .filtros input {
            width: 100%;
            box-sizing: border-box;
            min-height: 44px;
            padding: 0 13px;
            border: 1px solid #ccd8d1;
            border-radius: 8px;
            background: #ffffff;
            color: #173d2c;
            font-size: 14px;
            outline: none;
        }


        .filtros select:focus,
        .filtros input:focus {
            border-color: #0b7a3b;
            box-shadow: 0 0 0 3px rgba(11, 122, 59, 0.08);
        }


        /* =====================================================
           LISTA
        ===================================================== */

        .lista {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }


        .inscricao-card {
            padding: 20px;
            border: 1px solid #e2e9e4;
            border-radius: 12px;
            background: #fbfdfc;
        }


        .inscricao-topo {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
        }


        .inscricao-topo h3 {
            margin: 0 0 5px;
            color: #173d2c;
            font-size: 18px;
        }


        .inscricao-topo p {
            margin: 3px 0;
            color: #66766e;
            font-size: 13px;
        }


        .status {
            display: inline-flex;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 800;
            white-space: nowrap;
        }


        .status-pendente {
            background: #fff4dc;
            color: #996300;
        }


        .status-confirmado {
            background: #e7f6ed;
            color: #0b7a3b;
        }


        .status-cancelado {
            background: #fff0ef;
            color: #b42318;
        }


        .inscricao-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px 20px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #e5ebe7;
        }


        .inscricao-info p {
            margin: 0;
            color: #596b61;
            font-size: 13px;
            line-height: 1.5;
        }


        .inscricao-info strong {
            color: #294538;
        }


        .acoes {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 18px;
        }


        .btn {
            min-height: 38px;
            padding: 0 14px;
            border: 0;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s ease;
        }


        .btn-confirmar {
            background: #0b7a3b;
            color: #ffffff;
        }


        .btn-confirmar:hover {
            background: #086330;
        }


        .btn-editar {
            background: #edf5ef;
            color: #0b7a3b;
        }


        .mensagem {
            min-height: 20px;
            margin-bottom: 15px;
            color: #52665a;
            font-size: 13px;
            font-weight: 700;
        }


        .vazio {
            padding: 45px 20px;
            border: 1px dashed #ccd8d1;
            border-radius: 12px;
            background: #fbfcfb;
            color: #718078;
            text-align: center;
            font-size: 14px;
        }


        /* =====================================================
           RESPONSIVO
        ===================================================== */

        @media (max-width: 1000px) {

            .site-header .container {
                flex-direction: column;
                justify-content: center;
                padding: 18px 0;
            }


            .site-header nav {
                justify-content: center;
            }


            .resumo {
                grid-template-columns: repeat(2, 1fr);
            }

        }


        @media (max-width: 700px) {

            .filtros {
                grid-template-columns: 1fr;
            }


            .inscricao-info {
                grid-template-columns: 1fr;
            }


            .inscricao-topo {
                flex-direction: column;
            }

        }


        @media (max-width: 600px) {

            .site-header .container {
                min-height: 68px;
                gap: 10px;
            }


            .site-header .logo {
                font-size: 23px;
            }


            .site-header .logo span {
                font-size: 13px;
            }


            .site-header nav {
                gap: 4px;
            }


            .site-header nav a {
                min-height: 38px;
                font-size: 11px;
                padding: 0 8px;
            }


            .admin-container {
                margin-top: 25px;
            }


            .resumo {
                grid-template-columns: 1fr;
            }


            .card {
                padding: 18px;
            }

        }


        @media (max-width: 500px) {

            .site-header nav {
                width: 100%;
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 6px;
            }


            .site-header nav a {
                justify-content: center;
                text-align: center;
            }


            .site-header nav a:last-child {
                padding: 0 10px;
            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="site-header">

    <div class="container">

        <a
            href="index.html"
            class="logo"
        >
            CRFE
            <span>2027</span>
        </a>


        <nav>

            <a href="admin.html">
                Inscrições
            </a>

            <a href="admin-palestrantes.html">
                Palestrantes
            </a>

            <a href="admin-minicursos.html">
                Minicursos
            </a>

            <a href="admin-programacao.html">
                Programação
            </a>

            <a href="index.html">
                Site
            </a>

            <a
                href="#"
                id="btnSair"
            >
                Sair
            </a>

        </nav>

    </div>

</header>


<!-- =====================================================
     CONTEÚDO
===================================================== -->

<main class="admin-container">


    <div class="admin-header">

        <h1>
            Administração
        </h1>

        <p>
            Gerenciamento das inscrições e pagamentos do CRFE 2027.
        </p>

    </div>


    <!-- =================================================
         RESUMO
    ================================================== -->

    <section class="resumo">


        <div class="resumo-card">

            <span>
                Total de inscrições
            </span>

            <strong id="totalInscricoes">
                0
            </strong>

        </div>


        <div class="resumo-card">

            <span>
                Pagamentos pendentes
            </span>

            <strong id="pagamentosPendentes">
                0
            </strong>

        </div>


        <div class="resumo-card">

            <span>
                Pagamentos confirmados
            </span>

            <strong id="pagamentosConfirmados">
                0
            </strong>

        </div>


        <div class="resumo-card">

            <span>
                Valor arrecadado
            </span>

            <strong id="valorArrecadado">
                R$ 0,00
            </strong>

        </div>


    </section>


    <!-- =================================================
         INSCRIÇÕES
    ================================================== -->

    <section class="card">


        <div class="filtros">

            <select id="filtroPagamento">

                <option value="todos">
                    Todos os pagamentos
                </option>

                <option value="pendente">
                    Pendentes
                </option>

                <option value="confirmado">
                    Confirmados
                </option>

                <option value="cancelado">
                    Cancelados
                </option>

            </select>


            <input
                type="text"
                id="filtroBusca"
                placeholder="Buscar por nome, CPF ou e-mail..."
            >

        </div>


        <div
            id="mensagemAdmin"
            class="mensagem"
        ></div>


        <div
            id="listaInscricoes"
            class="lista"
        >

            <div class="vazio">
                Carregando inscrições...
            </div>

        </div>


    </section>


</main>


<script
    type="module"
    src="js/admin.js?v=3"
></script>


</body>

</html>
