<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Comissão Científica | CRFE Connect 2027</title>

    <meta
        name="description"
        content="Área da Comissão Científica do CRFE 2027."
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            font-family: "Poppins", sans-serif;

            background:
                #f4f7f5;

            color:
                #17201a;

            min-height:
                100vh;
        }

        a {
            text-decoration: none;
        }

        button,
        input,
        select {
            font-family: inherit;
        }

        /* =====================================================
           TOPO
        ===================================================== */

        .topo {

            background:
                linear-gradient(
                    135deg,
                    #0b7a3b,
                    #15a34a
                );

            color:
                white;

            padding:
                18px 24px;

            box-shadow:
                0 3px 15px rgba(0,0,0,.12);
        }

        .topo-conteudo {

            max-width:
                1200px;

            margin:
                0 auto;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                20px;
        }

        .logo-area h1 {

            font-size:
                21px;

            font-weight:
                700;
        }

        .logo-area p {

            margin-top:
                3px;

            font-size:
                12px;

            opacity:
                .9;
        }

        .btn-sair {

            border:
                1px solid rgba(255,255,255,.55);

            background:
                rgba(255,255,255,.10);

            color:
                white;

            padding:
                9px 16px;

            border-radius:
                8px;

            cursor:
                pointer;

            font-weight:
                600;

            transition:
                .2s;
        }

        .btn-sair:hover {

            background:
                rgba(255,255,255,.20);
        }

        /* =====================================================
           CONTAINER
        ===================================================== */

        .container {

            max-width:
                1200px;

            margin:
                0 auto;

            padding:
                32px 20px 50px;
        }

        .cabecalho {

            margin-bottom:
                25px;
        }

        .cabecalho h2 {

            font-size:
                28px;

            color:
                #0b7a3b;

            margin-bottom:
                5px;
        }

        .cabecalho p {

            color:
                #64706a;

            font-size:
                14px;
        }

        /* =====================================================
           CONTROLES
        ===================================================== */

        .controles {

            background:
                white;

            border:
                1px solid #e1e8e3;

            border-radius:
                14px;

            padding:
                18px;

            display:
                grid;

            grid-template-columns:
                minmax(220px, 1fr)
                220px;

            gap:
                14px;

            margin-bottom:
                22px;

            box-shadow:
                0 3px 12px rgba(0,0,0,.04);
        }

        .campo {

            display:
                flex;

            flex-direction:
                column;

            gap:
                6px;
        }

        .campo label {

            font-size:
                12px;

            font-weight:
                600;

            color:
                #526059;
        }

        .campo input,
        .campo select {

            width:
                100%;

            border:
                1px solid #d7e0da;

            border-radius:
                9px;

            padding:
                12px 13px;

            outline:
                none;

            background:
                white;

            color:
                #17201a;

            font-size:
                14px;
        }

        .campo input:focus,
        .campo select:focus {

            border-color:
                #0b7a3b;

            box-shadow:
                0 0 0 3px rgba(11,122,59,.10);
        }

        /* =====================================================
           RESUMO
        ===================================================== */

        .resumo {

            display:
                flex;

            gap:
                12px;

            flex-wrap:
                wrap;

            margin-bottom:
                22px;
        }

        .resumo-card {

            background:
                white;

            border:
                1px solid #e1e8e3;

            border-radius:
                12px;

            padding:
                14px 18px;

            min-width:
                160px;

            flex:
                1;

            box-shadow:
                0 3px 12px rgba(0,0,0,.035);
        }

        .resumo-card span {

            display:
                block;

            color:
                #68756e;

            font-size:
                12px;

            margin-bottom:
                3px;
        }

        .resumo-card strong {

            display:
                block;

            color:
                #0b7a3b;

            font-size:
                22px;
        }

        /* =====================================================
           LISTA
        ===================================================== */

        #listaTrabalhos {

            display:
                flex;

            flex-direction:
                column;

            gap:
                15px;
        }

        .estado {

            background:
                white;

            border:
                1px solid #e1e8e3;

            border-radius:
                14px;

            padding:
                30px;

            text-align:
                center;

            color:
                #68756e;
        }

        /* =====================================================
           CARD DO TRABALHO
        ===================================================== */

        .trabalho-card {

            background:
                white;

            border:
                1px solid #dfe7e1;

            border-radius:
                14px;

            padding:
                22px;

            box-shadow:
                0 4px 14px rgba(0,0,0,.045);
        }

        .trabalho-topo {

            display:
                flex;

            align-items:
                flex-start;

            justify-content:
                space-between;

            gap:
                20px;

            margin-bottom:
                18px;
        }

        .trabalho-titulo {

            font-size:
                19px;

            font-weight:
                700;

            color:
                #17201a;

            line-height:
                1.4;
        }

        .status {

            display:
                inline-flex;

            align-items:
                center;

            white-space:
                nowrap;

            border-radius:
                999px;

            padding:
                6px 11px;

            font-size:
                11px;

            font-weight:
                600;

            background:
                #fff4d6;

            color:
                #8a6200;
        }

        .informacoes {

            display:
                grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap:
                12px 22px;

            margin-bottom:
                20px;
        }

        .informacao {

            min-width:
                0;
        }

        .informacao span {

            display:
                block;

            color:
                #7a857f;

            font-size:
                11px;

            margin-bottom:
                2px;
        }

        .informacao strong {

            display:
                block;

            color:
                #303a34;

            font-size:
                13px;

            font-weight:
                500;

            overflow-wrap:
                anywhere;
        }

        .acoes {

            display:
                flex;

            align-items:
                center;

            gap:
                10px;

            flex-wrap:
                wrap;

            padding-top:
                17px;

            border-top:
                1px solid #edf1ee;
        }

        .btn-pdf {

            display:
                inline-flex;

            align-items:
                center;

            justify-content:
                center;

            gap:
                7px;

            background:
                #0b7a3b;

            color:
                white;

            padding:
                10px 16px;

            border-radius:
                8px;

            font-size:
                13px;

            font-weight:
                600;

            transition:
                .2s;
        }

        .btn-pdf:hover {

            background:
                #08632f;
        }

        .sem-arquivo {

            font-size:
                12px;

            color:
                #9a5d00;
        }

        /* =====================================================
           RESPONSIVO
        ===================================================== */

        @media (max-width: 700px) {

            .topo {

                padding:
                    16px;
            }

            .topo-conteudo {

                align-items:
                    flex-start;
            }

            .logo-area h1 {

                font-size:
                    18px;
            }

            .container {

                padding:
                    25px 14px 40px;
            }

            .cabecalho h2 {

                font-size:
                    23px;
            }

            .controles {

                grid-template-columns:
                    1fr;
            }

            .informacoes {

                grid-template-columns:
                    1fr;
            }

            .trabalho-topo {

                flex-direction:
                    column;
            }

            .status {

                align-self:
                    flex-start;
            }

            .trabalho-card {

                padding:
                    17px;
            }

        }

    </style>

    <style>
    .avaliacao-comissao {
        margin-top: 24px;
        padding: 20px;
        border-top: 1px solid #e5e7eb;
        background: #f8faf9;
        border-radius: 14px;
    }

    .avaliacao-comissao h4 {
        margin: 0 0 18px;
        color: #0B7A3B;
        font-size: 18px;
    }

    .avaliacao-comissao label {
        display: block;
        margin: 12px 0 7px;
        font-weight: 600;
        font-size: 14px;
        color: #374151;
    }

    .campo-avaliacao-status,
    .campo-avaliacao-observacao {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        padding: 11px 12px;
        background: #fff;
        font: inherit;
    }

    .campo-avaliacao-status {
        cursor: pointer;
    }

    .campo-avaliacao-observacao {
        resize: vertical;
        min-height: 95px;
    }

    .btn-salvar-avaliacao {
        margin-top: 14px;
        border: none;
        border-radius: 10px;
        padding: 12px 18px;
        background: #0B7A3B;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
    }

    .btn-salvar-avaliacao:hover {
        opacity: 0.92;
    }

    .btn-salvar-avaliacao:disabled {
        opacity: 0.6;
        cursor: wait;
    }

.btn-finalizar-avaliacao {
    margin-top: 8px;
    border: 1px solid #b91c1c;
    border-radius: 10px;
    padding: 12px 18px;
    background: #ffffff;
    color: #b91c1c;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
}

.btn-finalizar-avaliacao:hover {
    background: #b91c1c;
    color: #ffffff;
}

.btn-finalizar-avaliacao:disabled {
    background: #f3f4f6;
    color: #6b7280;
    border-color: #d1d5db;
    cursor: not-allowed;
}
        
    .mensagem-avaliacao {
        margin-top: 10px;
        font-size: 14px;
    }

    .avaliacao-sucesso {
        color: #15803d;
        font-weight: 600;
    }

    .avaliacao-erro {
        color: #b91c1c;
        font-weight: 600;
    }
</style> 
    
</head>


<body>

    <!-- =====================================================
         TOPO
    ====================================================== -->

    <header class="topo">

        <div class="topo-conteudo">

            <div class="logo-area">

                <h1>
                    CRFE CONNECT
                </h1>

                <p>
                    Comissão Científica · CRFE 2027
                </p>

            </div>


            <button
                type="button"
                id="btnSair"
                class="btn-sair"
            >
                Sair
            </button>

        </div>

    </header>


    <!-- =====================================================
         CONTEÚDO
    ====================================================== -->

    <main class="container">

        <div class="cabecalho">

            <h2>
                Trabalhos Científicos
            </h2>

            <p>
                Visualização dos trabalhos enviados ao CRFE 2027.
            </p>

        </div>


        <!-- =================================================
             CONTROLES
        ================================================== -->

        <section class="controles">

            <div class="campo">

                <label for="campoBusca">
                    Buscar trabalho
                </label>

                <input
                    type="search"
                    id="campoBusca"
                    placeholder="Título, autor ou instituição..."
                    autocomplete="off"
                >

            </div>


            <div class="campo">

                <label for="filtroStatus">
                    Status
                </label>

                <select id="filtroStatus">

                    <option value="todos">
                        Todos os status
                    </option>

                    <option value="em_avaliacao">
                        Em avaliação
                    </option>

                    <option value="aprovado">
                        Aprovado
                    </option>

                    <option value="aprovado_com_correcoes">
                        Aprovado com correções
                    </option>

                    <option value="reprovado">
                        Reprovado
                    </option>

                </select>

            </div>

        </section>


        <!-- =================================================
             RESUMO
        ================================================== -->

        <section class="resumo">

            <div class="resumo-card">

                <span>
                    Total de trabalhos
                </span>

                <strong id="totalTrabalhos">
                    0
                </strong>

            </div>


            <div class="resumo-card">

                <span>
                    Em avaliação
                </span>

                <strong id="totalAvaliacao">
                    0
                </strong>

            </div>

        </section>


        <!-- =================================================
             LISTA
        ================================================== -->

        <section id="listaTrabalhos">

            <div class="estado">

                Carregando trabalhos científicos...

            </div>

        </section>

    </main>


    <!-- =====================================================
         FIREBASE
    ====================================================== -->

    <script
        type="module"
        src="js/comissao-cientifica.js?v=2"
    ></script>

</body>

</html>
