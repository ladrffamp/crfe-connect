<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Login | CRFE Connect
    </title>

    <link
        rel="stylesheet"
        href="css/styles.css"
    >

</head>

<body>


<header class="topbar">

    <div class="logo-area">

        <span>
            CRFE 2027
        </span>

    </div>

    <nav>

        <a href="index.html">
            Início
        </a>

    </nav>

</header>



<main>

    <section class="section">

        <span class="section-label">
            CRFE CONNECT
        </span>


        <h1>
            Entrar
        </h1>


        <p>
            Acesse sua conta para acompanhar
            sua participação no CRFE 2027.
        </p>


        <form id="formLogin">


            <div>

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    required
                >

            </div>


            <br>


            <div>

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    required
                >

            </div>


            <br>


            <button
                type="submit"
                class="btn btn-primary"
            >
                ENTRAR
            </button>


        </form>


        <p id="mensagem"></p>


        <p>

            Ainda não possui uma conta?

            <a
                href="cadastro.html"
                style="color: #0B7A3B; font-weight: 600;"
            >
                Criar conta
            </a>

        </p>


    </section>

</main>



<script
    type="module"
    src="js/login.js"
></script>


</body>

</html>
