<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Palestrantes | CRFE 2027</title>

    <link
        rel="stylesheet"
        href="css/styles.css"
    >

    <style>

        /* =====================================================
           BASE
        ===================================================== */

        body {
            margin: 0;
            background: #f5f8f6;
            color: #173d2c;
            font-family: Arial, sans-serif;
        }


        /* =====================================================
           HEADER PADRÃO ADMIN
        ===================================================== */

        .site-header {
            width: 100%;
            background: #ffffff;
            border-bottom: 1px solid #e3e9e5;
            box-shadow: 0 2px 12px rgba(20, 60, 40, 0.04);
        }


        .site-header .container {
            width: min(1180px, 92%);
            min-height: 76px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
        }


        .site-header .logo {
            display: inline-flex;
            align-items: baseline;
            gap: 5px;
            color: #0b7a3b;
            text-decoration: none;
            font-size: 27px;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -0.5px;
            flex-shrink: 0;
        }


        .site-header .logo span {
            color: #173d2c;
            font-size: 15px;
            font-weight: 800;
        }


        /* =====================================================
           NAVEGAÇÃO
        ===================================================== */

        .site-header nav {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 20px;
            flex-wrap: wrap;
        }


        .site-header nav a {
            display: inline-flex;
            align-items: center;
            min-height: 42px;
            color: #294538;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
            transition: 0.2s ease;
        }


        .site-header nav a:hover {
            color: #0b7a3b;
        }


        .site-header nav a:last-child {
            padding: 0 17px;
            border-radius: 9px;
            background: #0b7a3b;
            color: #ffffff;
        }


        .site-header nav a:last-child:hover {
            background: #086330;
            color: #ffffff;
        }


        /* =====================================================
           CONTAINER
        ===================================================== */

        .admin-container {
            width: min(1180px, 92%);
            margin: 40px auto 70px;
        }


        /* =====================================================
           CABEÇALHO DA PÁGINA
        ===================================================== */

        .admin-header {
            margin-bottom: 30px;
        }


        .admin-header h1 {
            margin: 0 0 8px;
            font-size: 30px;
            color: #173d2c;
            letter-spacing: -0.5px;
        }


        .admin-header p {
            margin: 0;
            color: #65756d;
            font-size: 14px;
        }


        /* =====================================================
           LAYOUT
        ===================================================== */

        .layout {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 25px;
            align-items: start;
        }


        /* =====================================================
           CARDS
        ===================================================== */

        .card {
            background: #ffffff;
            border: 1px solid #e3e9e5;
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 4px 18px rgba(20, 60, 40, 0.05);
        }


        .card h2 {
            margin: 0 0 20px;
            color: #173d2c;
            font-size: 20px;
        }


        /* =====================================================
           FORMULÁRIO
        ===================================================== */

        .form-group {
            margin-bottom: 15px;
        }


        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 700;
            color: #294538;
        }


        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 13px;
            border: 1px solid #ccd8d1;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            background: #ffffff;
            color: #173d2c;
            transition: 0.2s ease;
        }


        .form-group textarea {
            min-height: 110px;
            resize: vertical;
        }


        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #9aa8a1;
        }


        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #0b7a3b;
            box-shadow: 0 0 0 3px rgba(11, 122, 59, 0.08);
        }


        /* =====================================================
           BOTÃO PRINCIPAL
        ===================================================== */

        .btn-principal {
            width: 100%;
            border: 0;
            border-radius: 9px;
            padding: 13px 18px;
            background: #0b7a3b;
            color: #ffffff;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s ease;
        }


        .btn-principal:hover {
            background: #086330;
        }


        .btn-principal:active {
            transform: translateY(1px);
        }


        /* =====================================================
           MENSAGEM
        ===================================================== */

        .mensagem {
            margin-top: 12px;
            min-height: 18px;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
        }


        /* =====================================================
           LISTA
        ===================================================== */

        .lista {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }


        /* =====================================================
           CARD DO PALESTRANTE
        ===================================================== */

        .palestrante-card {
            display: grid;
            grid-template-columns: 90px 1fr auto;
            gap: 18px;
            align-items: center;
            padding: 18px;
            border: 1px solid #e3e9e5;
            border-radius: 12px;
            background: #ffffff;
            transition: 0.2s ease;
        }


        .palestrante-card:hover {
            border-color: #cbd9d1;
            box-shadow: 0 4px 14px rgba(20, 60, 40, 0.05);
        }


        .palestrante-foto {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            background: #edf3ef;
            border: 2px solid #e8f0eb;
        }


        /* =====================================================
           INFORMAÇÕES
        ===================================================== */

        .palestrante-info {
            min-width: 0;
        }


        .palestrante-info h3 {
            margin: 0 0 5px;
            font-size: 18px;
            color: #173d2c;
            word-break: break-word;
        }


        .palestrante-info .profissao {
            margin: 0 0 7px;
            color: #0b7a3b;
            font-weight: 700;
            font-size: 14px;
        }


        .palestrante-info p {
            margin: 3px 0;
            color: #68776f;
            font-size: 13px;
            line-height: 1.4;
        }


        .palestrante-info strong {
            color: #43574d;
        }


        /* =====================================================
           AÇÕES
        ===================================================== */

        .acoes {
            display: flex;
            flex-direction: column;
            gap: 7px;
            min-width: 82px;
        }


        .btn-editar {
            border: 0;
            border-radius: 7px;
            padding: 9px 12px;
            background: #eaf5ee;
            color: #0b7a3b;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
        }


        .btn-editar:hover {
            background: #dcefe3;
        }


        .btn-excluir {
            border: 0;
            border-radius: 7px;
            padding: 9px 12px;
            background: #fff0f0;
            color: #b42318;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
        }


        .btn-excluir:hover {
            background: #ffe1e1;
        }


        /* =====================================================
           ESTADO VAZIO
        ===================================================== */

        .vazio {
            padding: 40px 20px;
            text-align: center;
            color: #718078;
            border: 1px dashed #ccd8d1;
            border-radius: 12px;
            background: #fbfcfb;
            font-size: 14px;
        }


        /* =====================================================
           STATUS
        ===================================================== */

        .status-ativo {
            display: inline-block;
            margin-top: 7px;
            padding: 4px 8px;
            border-radius: 20px;
            background: #e9f7ee;
            color: #0b7a3b;
            font-size: 11px;
            font-weight: 800;
        }


        .status-inativo {
            display: inline-block;
            margin-top: 7px;
            padding: 4px 8px;
            border-radius: 20px;
            background: #f1f1f1;
            color: #666666;
            font-size: 11px;
            font-weight: 800;
        }


        /* =====================================================
           RESPONSIVO
        ===================================================== */

        @media (max-width: 1000px) {

            .site-header .container {
                flex-direction: column;
                justify-content: center;
                padding: 18px 0;
            }


            .site-header nav {
                justify-content: center;
            }

        }


        @media (max-width: 850px) {

            .layout {
                grid-template-columns: 1fr;
            }

        }


        @media (max-width: 600px) {

            .site-header .container {
                min-height: 68px;
                gap: 10px;
            }


            .site-header .logo {
                font-size: 23px;
            }


            .site-header .logo span {
                font-size: 13px;
            }


            .site-header nav {
                gap: 4px;
            }


            .site-header nav a {
                min-height: 38px;
                font-size: 11px;
                padding: 0 8px;
            }


            .admin-container {
                margin-top: 25px;
            }


            .admin-header h1 {
                font-size: 25px;
            }


            .card {
                padding: 18px;
            }


            .palestrante-card {
                grid-template-columns: 70px 1fr;
                gap: 13px;
            }


            .palestrante-foto {
                width: 70px;
                height: 70px;
            }


            .acoes {
                grid-column: 1 / -1;
                flex-direction: row;
                min-width: 0;
            }


            .btn-editar,
            .btn-excluir {
                flex: 1;
            }

        }


        @media (max-width: 500px) {

            .site-header nav {
                width: 100%;
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 6px;
            }


            .site-header nav a {
                justify-content: center;
                text-align: center;
            }


            .site-header nav a:last-child {
                padding: 0 10px;
            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="site-header">

    <div class="container">

        <a
            href="index.html"
            class="logo"
        >
            CRFE
            <span>2027</span>
        </a>


        <nav>

            <a href="admin.html">
                Inscrições
            </a>

            <a href="admin-palestrantes.html">
                Palestrantes
            </a>

            <a href="admin-minicursos.html">
                Minicursos
            </a>

            <a href="admin-programacao.html">
                Programação
            </a>

            <a href="index.html">
                Site
            </a>

            <a
                href="#"
                id="btnSair"
            >
                Sair
            </a>

        </nav>

    </div>

</header>


<!-- =====================================================
     CONTEÚDO
===================================================== -->

<main class="admin-container">

    <div class="admin-header">

        <h1>
            Palestrantes
        </h1>

        <p>
            Cadastre e gerencie os palestrantes do CRFE 2027.
        </p>

    </div>


    <div class="layout">


        <!-- =================================================
             FORMULÁRIO
        ================================================== -->

        <section class="card">

            <h2>
                Novo palestrante
            </h2>


            <form id="formPalestrante">


                <div class="form-group">

                    <label for="nome">
                        Nome completo
                    </label>

                    <input
                        type="text"
                        id="nome"
                        autocomplete="name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="profissao">
                        Cargo / profissão
                    </label>

                    <input
                        type="text"
                        id="profissao"
                        placeholder="Ex.: Fisioterapeuta Esportivo"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="instituicao">
                        Instituição
                    </label>

                    <input
                        type="text"
                        id="instituicao"
                        placeholder="Ex.: Faculdade Morgana Potrich"
                    >

                </div>


                <div class="form-group">

                    <label for="tema">
                        Tema
                    </label>

                    <input
                        type="text"
                        id="tema"
                        placeholder="Tema da palestra ou participação"
                    >

                </div>


                <div class="form-group">

                    <label for="tipo">
                        Tipo de participação
                    </label>

                    <select id="tipo">

                        <option value="Palestra">
                            Palestra
                        </option>

                        <option value="Mesa-redonda">
                            Mesa-redonda
                        </option>

                        <option value="Minicurso">
                            Minicurso
                        </option>

                        <option value="Convidado">
                            Convidado
                        </option>

                        <option value="Outro">
                            Outro
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="foto">
                        URL da foto
                    </label>

                    <input
                        type="url"
                        id="foto"
                        placeholder="https://..."
                    >

                </div>


                <div class="form-group">

                    <label for="curriculo">
                        Mini currículo
                    </label>

                    <textarea
                        id="curriculo"
                        placeholder="Breve apresentação profissional..."
                    ></textarea>

                </div>


                <div class="form-group">

                    <label for="status">
                        Status
                    </label>

                    <select id="status">

                        <option value="ativo">
                            Ativo
                        </option>

                        <option value="inativo">
                            Inativo
                        </option>

                    </select>

                </div>


                <button
                    type="submit"
                    class="btn-principal"
                >
                    CADASTRAR PALESTRANTE
                </button>


                <div
                    id="mensagemPalestrante"
                    class="mensagem"
                ></div>


            </form>

        </section>


        <!-- =================================================
             LISTA
        ================================================== -->

        <section class="card">

            <h2>
                Palestrantes cadastrados
            </h2>


            <div
                id="listaPalestrantes"
                class="lista"
            >

                <div class="vazio">
                    Carregando palestrantes...
                </div>

            </div>

        </section>


    </div>

</main>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script
    type="module"
    src="js/admin-palestrantes.js?v=3"
></script>


</body>

</html>
