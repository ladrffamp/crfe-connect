<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Programação | CRFE 2027</title>

    <!-- =====================================================
         FONTES
    ====================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         CSS GLOBAL
    ====================================================== -->

    <link
        rel="stylesheet"
        href="css/styles.css"
    >


    <!-- =====================================================
         ESTILOS DA PÁGINA
    ====================================================== -->

    <style>

        /* =====================================================
           RESET
        ====================================================== */

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0;

            font-family: "Poppins", sans-serif;

            background: #f5f7f6;

            color: #173d2c;
        }


        /* =====================================================
           HEADER PADRÃO ADMIN
        ====================================================== */

        .site-header {
            width: 100%;

            background: #ffffff;

            border-bottom: 1px solid #e3e9e5;

            box-shadow:
                0 2px 12px
                rgba(20, 60, 40, 0.04);
        }


        .site-header .container {
            width: min(1180px, 92%);

            min-height: 76px;

            margin: 0 auto;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 30px;
        }


        .site-header .logo {
            display: inline-flex;

            align-items: baseline;

            gap: 5px;

            color: #0b7a3b;

            text-decoration: none;

            font-size: 27px;

            font-weight: 900;

            line-height: 1;

            letter-spacing: -0.5px;

            flex-shrink: 0;
        }


        .site-header .logo span {
            color: #173d2c;

            font-size: 15px;

            font-weight: 800;
        }


        .site-header nav {
            display: flex;

            align-items: center;

            justify-content: flex-end;

            gap: 20px;

            flex-wrap: wrap;
        }


        .site-header nav a {
            display: inline-flex;

            align-items: center;

            min-height: 42px;

            color: #294538;

            text-decoration: none;

            font-size: 14px;

            font-weight: 700;

            white-space: nowrap;

            transition: 0.2s ease;
        }


        .site-header nav a:hover {
            color: #0b7a3b;
        }


        .site-header nav a:last-child {
            padding: 0 17px;

            border-radius: 9px;

            background: #0b7a3b;

            color: #ffffff;
        }


        .site-header nav a:last-child:hover {
            background: #086330;

            color: #ffffff;
        }


        /* =====================================================
           CONTAINER PRINCIPAL
        ====================================================== */

        .container-principal {
            width: min(1180px, 92%);

            margin: 0 auto;

            padding: 38px 0 70px;
        }


        /* =====================================================
           CABEÇALHO DA PÁGINA
        ====================================================== */

        .page-heading {
            margin-bottom: 28px;
        }


        .page-heading h1 {
            margin: 0;

            color: #075c2d;

            font-size: 30px;

            line-height: 1.2;

            font-weight: 800;
        }


        .page-heading p {
            margin: 8px 0 0;

            color: #6c7972;

            font-size: 14px;

            line-height: 1.6;
        }


        /* =====================================================
           CARD
        ====================================================== */

        .card {
            background: #ffffff;

            border: 1px solid #e1e8e3;

            border-radius: 16px;

            padding: 26px;

            margin-bottom: 24px;

            box-shadow:
                0 5px 20px
                rgba(20, 60, 40, 0.05);
        }


        .card h2 {
            margin: 0 0 22px;

            color: #075c2d;

            font-size: 19px;

            font-weight: 800;
        }


        /* =====================================================
           GRID
        ====================================================== */

        .form-grid {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 17px;
        }


        .campo {
            display: flex;

            flex-direction: column;

            gap: 7px;
        }


        .campo-full {
            grid-column: 1 / -1;
        }


        /* =====================================================
           LABEL
        ====================================================== */

        label {
            color: #365342;

            font-size: 13px;

            font-weight: 700;
        }


        /* =====================================================
           INPUTS
        ====================================================== */

        input,
        select,
        textarea {
            width: 100%;

            padding: 12px 13px;

            border: 1px solid #d6dfd9;

            border-radius: 9px;

            background: #ffffff;

            color: #173d2c;

            font-family: "Poppins", sans-serif;

            font-size: 14px;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }


        input:focus,
        select:focus,
        textarea:focus {
            border-color: #0b7a3b;

            box-shadow:
                0 0 0 3px
                rgba(11, 122, 59, 0.09);
        }


        textarea {
            min-height: 110px;

            resize: vertical;
        }


        /* =====================================================
           BOTÕES
        ====================================================== */

        .acoes-form {
            display: flex;

            align-items: center;

            gap: 10px;

            margin-top: 22px;

            flex-wrap: wrap;
        }


        button {
            border: 0;

            border-radius: 9px;

            padding: 11px 18px;

            font-family: "Poppins", sans-serif;

            font-size: 13px;

            font-weight: 700;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.15s ease;
        }


        button:hover {
            transform: translateY(-1px);
        }


        .btn-primary {
            background: #0b7a3b;

            color: #ffffff;
        }


        .btn-primary:hover {
            background: #075c2d;
        }


        .btn-secondary {
            background: #e9efeb;

            color: #294538;
        }


        .btn-secondary:hover {
            background: #dce6df;
        }


        .btn-edit {
            background: #eaf4ee;

            color: #0b7a3b;
        }


        .btn-delete {
            background: #ffe9e9;

            color: #a42828;
        }


        .btn-delete:hover {
            background: #ffdada;
        }


        /* =====================================================
           MENSAGEM
        ====================================================== */

        #mensagemProgramacao {
            margin-top: 17px;

            padding: 12px 14px;

            border-radius: 9px;

            font-size: 13px;

            display: none;
        }


        #mensagemProgramacao.sucesso {
            display: block;

            background: #e8f7ed;

            color: #176b38;
        }


        #mensagemProgramacao.erro {
            display: block;

            background: #ffe8e8;

            color: #9b2424;
        }


        /* =====================================================
           LISTA
        ====================================================== */

        #listaProgramacao {
            display: flex;

            flex-direction: column;

            gap: 14px;
        }


        /* =====================================================
           ITEM DA PROGRAMAÇÃO
        ====================================================== */

        .programacao-item {
            border: 1px solid #e1e8e3;

            border-radius: 14px;

            padding: 19px;

            background: #ffffff;

            transition: 0.2s ease;
        }


        .programacao-item:hover {
            border-color: #cbd8d0;

            box-shadow:
                0 4px 15px
                rgba(20, 60, 40, 0.05);
        }


        .programacao-cabecalho {
            display: flex;

            justify-content: space-between;

            align-items: flex-start;

            gap: 20px;
        }


        .programacao-principal {
            min-width: 0;
        }


        .programacao-data {
            margin-bottom: 4px;

            color: #0b7a3b;

            font-size: 12px;

            font-weight: 800;

            text-transform: uppercase;
        }


        .programacao-item h3 {
            margin: 0 0 7px;

            color: #173d2c;

            font-size: 18px;

            line-height: 1.35;
        }


        .programacao-info {
            color: #69766f;

            font-size: 13px;

            line-height: 1.8;
        }


        .programacao-info strong {
            color: #3b5145;
        }


        /* =====================================================
           BADGE
        ====================================================== */

        .badge {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            padding: 5px 10px;

            border-radius: 20px;

            background: #e7f7ed;

            color: #176b38;

            font-size: 11px;

            font-weight: 700;

            white-space: nowrap;
        }


        .badge.cancelado {
            background: #ffe8e8;

            color: #a42626;
        }


        /* =====================================================
           AÇÕES DO ITEM
        ====================================================== */

        .programacao-acoes {
            display: flex;

            gap: 8px;

            margin-top: 15px;

            flex-wrap: wrap;
        }


        .programacao-acoes button {
            padding: 9px 13px;

            font-size: 12px;
        }


        /* =====================================================
           ESTADO VAZIO
        ====================================================== */

        .estado-vazio {
            padding: 35px 20px;

            border: 1px dashed #cfdad3;

            border-radius: 12px;

            text-align: center;

            color: #758179;

            font-size: 14px;
        }


        /* =====================================================
           LOADING
        ====================================================== */

        .loading {
            padding: 30px;

            text-align: center;

            color: #738078;

            font-size: 14px;
        }


        /* =====================================================
           RESPONSIVO
        ====================================================== */

        @media (max-width: 1000px) {

            .site-header .container {
                flex-direction: column;

                justify-content: center;

                padding: 18px 0;
            }


            .site-header nav {
                justify-content: center;
            }

        }


        @media (max-width: 800px) {

            .form-grid {
                grid-template-columns: 1fr;
            }


            .campo-full {
                grid-column: auto;
            }


            .programacao-cabecalho {
                flex-direction: column;

                gap: 10px;
            }

        }


        @media (max-width: 600px) {

            .site-header .container {
                min-height: 68px;

                gap: 10px;
            }


            .site-header .logo {
                font-size: 23px;
            }


            .site-header .logo span {
                font-size: 13px;
            }


            .site-header nav {
                gap: 4px;
            }


            .site-header nav a {
                min-height: 38px;

                padding: 0 8px;

                font-size: 11px;
            }


            .container-principal {
                width: 92%;

                padding-top: 25px;
            }


            .page-heading h1 {
                font-size: 25px;
            }


            .card {
                padding: 18px;
            }

        }


        @media (max-width: 500px) {

            .site-header nav {
                width: 100%;

                display: grid;

                grid-template-columns:
                    repeat(2, 1fr);

                gap: 6px;
            }


            .site-header nav a {
                justify-content: center;

                text-align: center;
            }


            .site-header nav a:last-child {
                padding: 0 10px;
            }


            .acoes-form {
                flex-direction: column;

                align-items: stretch;
            }


            .acoes-form button {
                width: 100%;
            }


            .programacao-acoes {
                flex-direction: column;
            }


            .programacao-acoes button {
                width: 100%;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="site-header">

        <div class="container">

            <a
                href="index.html"
                class="logo"
            >
                CRFE
                <span>2027</span>
            </a>


            <nav>

                <a href="admin.html">
                    Inscrições
                </a>

                <a href="admin-palestrantes.html">
                    Palestrantes
                </a>

                <a href="admin-minicursos.html">
                    Minicursos
                </a>

                <a href="admin-programacao.html">
                    Programação
                </a>

                <a href="index.html">
                    Site
                </a>

                <a
                    href="#"
                    id="btnSair"
                >
                    Sair
                </a>

            </nav>

        </div>

    </header>



    <!-- =====================================================
         CONTEÚDO PRINCIPAL
    ====================================================== -->

    <main class="container-principal">


        <!-- =================================================
             TÍTULO
        ================================================== -->

        <section class="page-heading">

            <h1>
                Programação do CRFE 2027
            </h1>

            <p>
                Cadastre e organize palestras, mesas-redondas,
                minicursos e demais atividades do congresso.
            </p>

        </section>



        <!-- =================================================
             FORMULÁRIO
        ================================================== -->

        <section class="card">

            <h2 id="tituloFormulario">
                Nova atividade
            </h2>


            <form id="formProgramacao">


                <div class="form-grid">


                    <!-- DATA -->

                    <div class="campo">

                        <label for="data">
                            Data
                        </label>

                        <input
                            type="date"
                            id="data"
                            required
                        >

                    </div>



                    <!-- DIA -->

                    <div class="campo">

                        <label for="dia">
                            Dia
                        </label>

                        <select
                            id="dia"
                            required
                        >

                            <option value="">
                                Selecione o dia
                            </option>

                            <option value="sexta">
                                Sexta-feira
                            </option>

                            <option value="sabado">
                                Sábado
                            </option>

                            <option value="domingo">
                                Domingo
                            </option>

                        </select>

                    </div>



                    <!-- INÍCIO -->

                    <div class="campo">

                        <label for="inicio">
                            Horário de início
                        </label>

                        <input
                            type="time"
                            id="inicio"
                            required
                        >

                    </div>



                    <!-- FIM -->

                    <div class="campo">

                        <label for="fim">
                            Horário de término
                        </label>

                        <input
                            type="time"
                            id="fim"
                        >

                    </div>



                    <!-- TIPO -->

                    <div class="campo">

                        <label for="tipo">
                            Tipo de atividade
                        </label>

                        <select
                            id="tipo"
                            required
                        >

                            <option value="">
                                Selecione o tipo
                            </option>

                            <option value="Palestra">
                                Palestra
                            </option>

                            <option value="Mesa-redonda">
                                Mesa-redonda
                            </option>

                            <option value="Minicurso">
                                Minicurso
                            </option>

                            <option value="Cerimônia">
                                Cerimônia
                            </option>

                            <option value="Intervalo">
                                Intervalo
                            </option>

                            <option value="Outro">
                                Outro
                            </option>

                        </select>

                    </div>



                    <!-- STATUS -->

                    <div class="campo">

                        <label for="status">
                            Status
                        </label>

                        <select id="status">

                            <option value="Programado">
                                Programado
                            </option>

                            <option value="Cancelado">
                                Cancelado
                            </option>

                        </select>

                    </div>



                    <!-- TÍTULO -->

                    <div class="campo campo-full">

                        <label for="titulo">
                            Título da atividade
                        </label>

                        <input
                            type="text"
                            id="titulo"
                            placeholder="Ex.: Avaliação funcional do atleta"
                            required
                        >

                    </div>



                    <!-- PALESTRANTE -->

                    <div class="campo">

                        <label for="palestrante">
                            Palestrante / responsável
                        </label>

                        <select id="palestrante">

                            <option value="">
                                Nenhum / não informado
                            </option>

                        </select>

                    </div>



                    <!-- LOCAL -->

                    <div class="campo">

                        <label for="local">
                            Local
                        </label>

                        <input
                            type="text"
                            id="local"
                            placeholder="Ex.: Auditório Principal"
                        >

                    </div>



                    <!-- DESCRIÇÃO -->

                    <div class="campo campo-full">

                        <label for="descricao">
                            Descrição / observações
                        </label>

                        <textarea
                            id="descricao"
                            placeholder="Digite informações adicionais sobre a atividade..."
                        ></textarea>

                    </div>


                </div>



                <!-- =================================================
                     BOTÕES
                ================================================== -->

                <div class="acoes-form">

                    <button
                        type="submit"
                        id="btnSalvar"
                        class="btn-primary"
                    >
                        Salvar atividade
                    </button>


                    <button
                        type="button"
                        id="btnCancelar"
                        class="btn-secondary"
                        style="display: none;"
                    >
                        Cancelar edição
                    </button>

                </div>



                <!-- =================================================
                     MENSAGEM
                ================================================== -->

                <div
                    id="mensagemProgramacao"
                ></div>


            </form>

        </section>



        <!-- =================================================
             LISTA DA PROGRAMAÇÃO
        ================================================== -->

        <section class="card">

            <h2>
                Atividades cadastradas
            </h2>


            <div id="listaProgramacao">

                <div class="loading">
                    Carregando programação...
                </div>

            </div>

        </section>


    </main>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script
        type="module"
        src="js/admin-programacao.js?v=1"
    ></script>


</body>

</html>
