<form id="formCadastro">

    <div class="form-grid">

        <div class="form-group full">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" placeholder="Digite seu nome completo" required>
        </div>

        <div class="form-group">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" required>
        </div>

        <div class="form-group">
            <label for="nascimento">Data de nascimento</label>
            <input type="date" id="nascimento" required>
        </div>

        <div class="form-group">
            <label for="telefone">Telefone / WhatsApp</label>
            <input type="tel" id="telefone" placeholder="(00) 00000-0000" required>
        </div>

        <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="seuemail@email.com" required>
        </div>

        <div class="form-group">
            <label for="cidade">Cidade</label>
            <input type="text" id="cidade" placeholder="Sua cidade" required>
        </div>

        <div class="form-group">
            <label for="estado">Estado</label>

            <select id="estado" required>
                <option value="">Selecione seu estado</option>
                <option value="AC">Acre</option>
                <option value="AL">Alagoas</option>
                <option value="AP">Amapá</option>
                <option value="AM">Amazonas</option>
                <option value="BA">Bahia</option>
                <option value="CE">Ceará</option>
                <option value="DF">Distrito Federal</option>
                <option value="ES">Espírito Santo</option>
                <option value="GO">Goiás</option>
                <option value="MA">Maranhão</option>
                <option value="MT">Mato Grosso</option>
                <option value="MS">Mato Grosso do Sul</option>
                <option value="MG">Minas Gerais</option>
                <option value="PA">Pará</option>
                <option value="PB">Paraíba</option>
                <option value="PR">Paraná</option>
                <option value="PE">Pernambuco</option>
                <option value="PI">Piauí</option>
                <option value="RJ">Rio de Janeiro</option>
                <option value="RN">Rio Grande do Norte</option>
                <option value="RS">Rio Grande do Sul</option>
                <option value="RO">Rondônia</option>
                <option value="RR">Roraima</option>
                <option value="SC">Santa Catarina</option>
                <option value="SP">São Paulo</option>
                <option value="SE">Sergipe</option>
                <option value="TO">Tocantins</option>
            </select>
        </div>

        <div class="form-group full">
            <label for="instituicao">Instituição</label>
            <input
                type="text"
                id="instituicao"
                placeholder="Faculdade, universidade, clínica ou empresa"
                required
            >
        </div>

        <div class="form-group full">
            <label for="cursoProfissao">Curso / Profissão</label>
            <input
                type="text"
                id="cursoProfissao"
                placeholder="Ex.: Fisioterapia"
                required
            >
        </div>

        <div class="form-group">
            <label for="senha">Senha</label>
            <input
                type="password"
                id="senha"
                minlength="6"
                placeholder="Mínimo de 6 caracteres"
                required
            >
        </div>

        <div class="form-group">
            <label for="confirmarSenha">Confirmar senha</label>
            <input
                type="password"
                id="confirmarSenha"
                minlength="6"
                placeholder="Repita sua senha"
                required
            >
        </div>

    </div>

    <button type="submit" class="btn btn-primary">
        CRIAR CONTA
    </button>

</form>
