<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Cadastro | CRFE Connect
    </title>

    <link
        rel="stylesheet"
        href="css/styles.css"
    >

</head>

<body>


<header class="topbar">

    <div class="logo-area">

        <span>
            CRFE 2027
        </span>

    </div>

    <nav>

        <a href="index.html">
            Início
        </a>

    </nav>

</header>



<main>

    <section class="section">

        <span class="section-label">
            CRFE CONNECT
        </span>


        <h1>
            Criar minha conta
        </h1>


        <p>
            Cadastre-se para participar do
            Congresso Regional de Fisioterapia Esportiva.
        </p>


        <form id="formCadastro">


            <div>

                <label for="nome">
                    Nome completo
                </label>

                <input
                    type="text"
                    id="nome"
                    required
                >

            </div>


            <br>


            <div>

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    required
                >

            </div>


            <br>


            <div>

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    minlength="6"
                    required
                >

            </div>


            <br>


            <div>

                <label for="confirmarSenha">
                    Confirmar senha
                </label>

                <input
                    type="password"
                    id="confirmarSenha"
                    minlength="6"
                    required
                >

            </div>


            <br>


            <button
                type="submit"
                class="btn btn-primary"
            >
                CRIAR CONTA
            </button>


        </form>


        <p id="mensagem"></p>


    </section>

</main>



<script
    type="module"
    src="js/cadastro.js"
></script>


</body>

</html>
